<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ergoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b5bd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c6d79;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="chair">
    <!-- Backrest -->
    <ellipse cx="200" cy="100" rx="50" ry="70" fill="url(#ergoGrad)" opacity="0.9"/>
    <!-- Lumbar support indicator -->
    <ellipse cx="200" cy="130" rx="30" ry="15" fill="#3f8a95" opacity="0.7"/>
    <!-- Seat -->
    <ellipse cx="200" cy="160" rx="55" ry="30" fill="url(#ergoGrad)"/>
    <!-- Armrests -->
    <rect x="125" y="145" width="15" height="40" fill="#5a9fa7" rx="8"/>
    <rect x="260" y="145" width="15" height="40" fill="#5a9fa7" rx="8"/>
    <!-- Base -->
    <circle cx="200" cy="210" r="35" fill="#2c6d79" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="170" cy="235" r="8" fill="#1a4a52"/>
    <circle cx="230" cy="235" r="8" fill="#1a4a52"/>
    <!-- Height adjustment -->
    <rect x="197" y="190" width="6" height="20" fill="#444" rx="2"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Ergo Cloud Chair</text>
</svg>