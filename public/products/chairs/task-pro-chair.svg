<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d7685;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f252d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="chair">
    <!-- Headrest -->
    <rect x="180" y="60" width="40" height="40" fill="#2a3139" rx="8"/>
    <ellipse cx="200" cy="55" rx="25" ry="12" fill="#3f4652"/>
    <!-- Backrest with lumbar -->
    <rect x="165" y="95" width="70" height="85" fill="url(#taskGrad)" rx="8"/>
    <!-- Lumbar support -->
    <ellipse cx="200" cy="135" rx="20" ry="12" fill="#4a5566" opacity="0.8"/>
    <!-- Seat -->
    <ellipse cx="200" cy="180" rx="60" ry="32" fill="url(#taskGrad)"/>
    <!-- Adjustable armrests -->
    <rect x="115" y="155" width="18" height="50" fill="#3f4652" rx="4"/>
    <rect x="267" y="155" width="18" height="50" fill="#3f4652" rx="4"/>
    <!-- Control levers -->
    <circle cx="135" cy="175" r="4" fill="#555"/>
    <circle cx="265" cy="175" r="4" fill="#555"/>
    <!-- Gas cylinder -->
    <rect x="197" y="180" width="6" height="30" fill="#333" rx="1"/>
    <!-- Base with wheels -->
    <circle cx="200" cy="220" r="32" fill="#1a1f26"/>
    <circle cx="170" cy="245" r="10" fill="#0d1117"/>
    <circle cx="230" cy="245" r="10" fill="#0d1117"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Task Pro Chair</text>
</svg>