<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#83c5f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f72b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="desk">
    <!-- Desktop (smaller) -->
    <rect x="120" y="140" width="160" height="16" fill="url(#compactGrad)" rx="2"/>
    <!-- Simple legs -->
    <rect x="130" y="156" width="10" height="70" fill="#444" rx="2"/>
    <rect x="260" y="156" width="10" height="70" fill="#444" rx="2"/>
    <!-- Shelf underneath -->
    <rect x="120" y="190" width="160" height="12" fill="#5fa3d0" opacity="0.6" rx="1"/>
    <!-- Storage indicator -->
    <rect x="140" y="210" width="8" height="15" fill="#3f7fbe" opacity="0.7"/>
    <rect x="160" y="210" width="8" height="15" fill="#3f7fbe" opacity="0.7"/>
    <rect x="180" y="210" width="8" height="15" fill="#3f7fbe" opacity="0.7"/>
    <rect x="200" y="210" width="8" height="15" fill="#3f7fbe" opacity="0.7"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Compact Focus Desk</text>
</svg>