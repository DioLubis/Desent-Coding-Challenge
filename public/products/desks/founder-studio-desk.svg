<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="founderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c6b7d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252431;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="desk">
    <!-- Large desktop -->
    <rect x="60" y="110" width="280" height="24" fill="url(#founderGrad)" rx="3"/>
    <!-- Cable tray -->
    <rect x="70" y="134" width="260" height="6" fill="#444" rx="2" opacity="0.8"/>
    <!-- Control panel -->
    <circle cx="80" cy="155" r="5" fill="#888"/>
    <circle cx="100" cy="155" r="5" fill="#888"/>
    <circle cx="120" cy="155" r="5" fill="#888"/>
    <!-- Sturdy legs -->
    <rect x="75" y="160" width="16" height="80" fill="#222" rx="2"/>
    <rect x="309" y="160" width="16" height="80" fill="#222" rx="2"/>
    <!-- Premium accent -->
    <rect x="60" y="100" width="280" height="3" fill="#777" opacity="0.6"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Founder Studio Desk</text>
</svg>