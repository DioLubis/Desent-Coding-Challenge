<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a9a6f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d7a4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6aaa7f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8824a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="plant">
    <!-- Pot -->
    <path d="M 150 180 L 160 260 L 240 260 L 250 180 Z" fill="url(#potGrad)" stroke="#8b6f47" stroke-width="2"/>
    <!-- Pot rim -->
    <ellipse cx="200" cy="180" rx="50" ry="12" fill="#c19a5c" stroke="#8b6f47" stroke-width="1"/>
    <!-- Pot detail -->
    <ellipse cx="200" cy="185" rx="48" ry="8" fill="#d4a574" opacity="0.6"/>
    <!-- Soil -->
    <ellipse cx="200" cy="190" rx="45" ry="10" fill="#7a6a5a"/>
    <!-- Left leaf cluster -->
    <ellipse cx="160" cy="120" rx="25" ry="70" fill="url(#leafGrad1)" transform="rotate(-35 160 120)"/>
    <ellipse cx="155" cy="95" rx="22" ry="60" fill="url(#leafGrad2)" transform="rotate(-50 155 95)"/>
    <!-- Center leaf cluster -->
    <ellipse cx="200" cy="80" rx="28" ry="80" fill="url(#leafGrad1)"/>
    <ellipse cx="205" cy="50" rx="20" ry="70" fill="url(#leafGrad2)"/>
    <!-- Right leaf cluster -->
    <ellipse cx="240" cy="120" rx="25" ry="70" fill="url(#leafGrad1)" transform="rotate(35 240 120)"/>
    <ellipse cx="245" cy="95" rx="22" ry="60" fill="url(#leafGrad2)" transform="rotate(50 245 95)"/>
    <!-- Leaf highlights -->
    <ellipse cx="200" cy="100" rx="8" ry="40" fill="#86c987" opacity="0.4"/>
    <ellipse cx="165" cy="130" rx="6" ry="35" fill="#86c987" opacity="0.3"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Tropical Desk Plant</text>
</svg>