<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9f8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db584d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boardSurfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="board">
    <!-- Board frame -->
    <rect x="60" y="50" width="280" height="160" fill="url(#boardFrameGrad)" stroke="#c8463d" stroke-width="3" rx="4"/>
    <!-- Board surface -->
    <rect x="70" y="60" width="260" height="140" fill="url(#boardSurfaceGrad)" rx="2"/>
    <!-- Grid lines (whiteboard) -->
    <line x1="70" y1="85" x2="330" y2="85" stroke="#ddd" stroke-width="1"/>
    <line x1="70" y1="110" x2="330" y2="110" stroke="#ddd" stroke-width="1"/>
    <line x1="70" y1="135" x2="330" y2="135" stroke="#ddd" stroke-width="1"/>
    <line x1="70" y1="160" x2="330" y2="160" stroke="#ddd" stroke-width="1"/>
    <!-- Content (marker writing simulation) -->
    <text x="80" y="75" font-family="Arial" font-size="12" font-weight="bold" fill="#d32f2f">SPRINT PLAN</text>
    <line x1="80" y1="90" x2="180" y2="90" stroke="#f57c00" stroke-width="2"/>
    <circle cx="85" cy="105" r="3" fill="#f57c00"/>
    <text x="95" y="108" font-family="Arial" font-size="10" fill="#333">Task 1</text>
    <circle cx="85" cy="128" r="3" fill="#f57c00"/>
    <text x="95" y="131" font-family="Arial" font-size="10" fill="#333">Task 2</text>
    <circle cx="85" cy="151" r="3" fill="#f57c00"/>
    <text x="95" y="154" font-family="Arial" font-size="10" fill="#333">Task 3</text>
    <!-- Marker tray -->
    <rect x="60" y="210" width="280" height="12" fill="url(#boardFrameGrad)" rx="2"/>
    <!-- Markers -->
    <circle cx="90" cy="216" r="4" fill="#f57c00"/>
    <circle cx="115" cy="216" r="4" fill="#d32f2f"/>
    <circle cx="140" cy="216" r="4" fill="#388e3c"/>
    <circle cx="165" cy="216" r="4" fill="#1976d2"/>
    <!-- Eraser -->
    <rect x="280" y="208" width="25" height="16" fill="#fff8dc" stroke="#999" stroke-width="1" rx="2"/>
    <!-- Stand/mounting bracket -->
    <path d="M 200 220 L 200 240" stroke="#888" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="200" cy="245" rx="40" ry="12" fill="#777" opacity="0.5"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Planning Board</text>
</svg>