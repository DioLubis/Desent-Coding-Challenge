<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shelfWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cf9ce6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8350a2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b69b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a4a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="shelf">
    <!-- Left support -->
    <rect x="100" y="60" width="12" height="180" fill="url(#frameGrad)" rx="3"/>
    <!-- Right support -->
    <rect x="288" y="60" width="12" height="180" fill="url(#frameGrad)" rx="3"/>
    <!-- Top shelf -->
    <rect x="95" y="85" width="210" height="14" fill="url(#shelfWoodGrad)" stroke="#7a4a9a" stroke-width="1"/>
    <!-- Middle shelf -->
    <rect x="95" y="145" width="210" height="14" fill="url(#shelfWoodGrad)" stroke="#7a4a9a" stroke-width="1"/>
    <!-- Bottom shelf -->
    <rect x="95" y="205" width="210" height="14" fill="url(#shelfWoodGrad)" stroke="#7a4a9a" stroke-width="1"/>
    <!-- Shelf depth -->
    <line x1="105" y1="85" x2="110" y2="95" stroke="#8a5aaa" stroke-width="2" opacity="0.5"/>
    <line x1="295" y1="85" x2="290" y2="95" stroke="#8a5aaa" stroke-width="2" opacity="0.5"/>
    <!-- Items on shelves -->
    <rect x="130" y="75" width="12" height="15" fill="#a888c8" rx="2"/>
    <rect x="150" y="75" width="12" height="15" fill="#a888c8" rx="2"/>
    <rect x="170" y="75" width="12" height="15" fill="#a888c8" rx="2"/>
    <rect x="190" y="75" width="12" height="15" fill="#a888c8" rx="2"/>
    <!-- Middle shelf items -->
    <rect x="120" y="135" width="15" height="20" fill="#9a78b8" rx="2"/>
    <rect x="145" y="135" width="15" height="20" fill="#9a78b8" rx="2"/>
    <rect x="170" y="135" width="15" height="20" fill="#9a78b8" rx="2"/>
    <rect x="195" y="135" width="15" height="20" fill="#9a78b8" rx="2"/>
    <rect x="220" y="135" width="15" height="20" fill="#9a78b8" rx="2"/>
    <!-- Bottom shelf items -->
    <rect x="115" y="195" width="18" height="25" fill="#8a68a8" rx="2"/>
    <rect x="145" y="195" width="18" height="25" fill="#8a68a8" rx="2"/>
    <rect x="175" y="195" width="18" height="25" fill="#8a68a8" rx="2"/>
    <rect x="205" y="195" width="18" height="25" fill="#8a68a8" rx="2"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Open Utility Shelf</text>
</svg>