<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <g id="monitor">
    <!-- Screen bezel -->
    <rect x="80" y="60" width="240" height="145" fill="url(#monitorGrad)" rx="4"/>
    <!-- Screen content area -->
    <rect x="90" y="72" width="220" height="125" fill="#1a1a1a" rx="2"/>
    <!-- Display content simulation -->
    <rect x="100" y="80" width="80" height="50" fill="#2a5a8a" opacity="0.6"/>
    <rect x="190" y="80" width="100" height="50" fill="#8a5a2a" opacity="0.5"/>
    <rect x="100" y="140" width="190" height="8" fill="#4a7a9a" opacity="0.4"/>
    <rect x="100" y="155" width="190" height="8" fill="#4a7a9a" opacity="0.4"/>
    <!-- Bezels (thin modern frame) -->
    <rect x="80" y="60" width="240" height="2" fill="#111"/>
    <!-- Stand -->
    <rect x="170" y="205" width="60" height="8" fill="#333" rx="2"/>
    <!-- Stand base -->
    <ellipse cx="200" cy="221" rx="45" ry="10" fill="#333"/>
    <!-- VESA mount indicator -->
    <circle cx="200" cy="212" r="3" fill="#555" opacity="0.5"/>
  </g>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">27" Creator Monitor</text>
</svg>